<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">After: rule-based tab names make repeated tabs easy to identify</title>
  <desc id="desc">An original browser interface illustration showing descriptive labels applied to issue tracker and pull request tabs in a vertical tab sidebar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b25"/><stop offset="1" stop-color="#12383c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#203b42"/><stop offset="1" stop-color="#182c36"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36d5b2"/><stop offset="1" stop-color="#79e6cf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#031312" flood-opacity=".44"/></filter>
    <filter id="soft" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1420" cy="105" r="210" fill="#35d7af" opacity=".15" filter="url(#soft)"/>
  <circle cx="100" cy="900" r="190" fill="#3b82f6" opacity=".12" filter="url(#soft)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="110" y="116" fill="#86dbc8" font-size="24" font-weight="700" letter-spacing="3">VERTICAL TAB SIDEBAR · AFTER</text>
    <text x="110" y="173" fill="#f8fafc" font-size="46" font-weight="760">Rules put the context first.</text>
    <text x="110" y="215" fill="#bed8d7" font-size="24">Keep the original page title, then add the signal you need to scan quickly.</text>

    <g transform="translate(110 275)" filter="url(#shadow)">
      <rect width="1380" height="590" rx="25" fill="#0d1920" stroke="#3e6970" stroke-width="2"/>
      <path d="M0 25Q0 0 25 0H1355Q1380 0 1380 25V72H0Z" fill="#1f3942"/>
      <circle cx="38" cy="36" r="8" fill="#ff6b67"/><circle cx="66" cy="36" r="8" fill="#f9bf45"/><circle cx="94" cy="36" r="8" fill="#61d28c"/>
      <rect x="156" y="19" width="515" height="36" rx="10" fill="#30505a"/>
      <circle cx="177" cy="37" r="8" fill="#85e0ce"/><text x="196" y="43" fill="#d2efea" font-size="16">workspace / browser</text>
      <rect y="72" width="548" height="518" fill="url(#panel)"/>
      <path d="M548 72V590" stroke="#3e6970" stroke-width="2"/>
      <text x="28" y="111" fill="#a8d0ca" font-size="15" font-weight="700" letter-spacing="1.6">OPEN TABS · RENAMED BY RULE</text>
      <g transform="translate(25 132)">
        <rect width="498" height="70" rx="12" fill="#315c62" stroke="#6cc9b7"/>
        <rect x="14" y="14" width="42" height="42" rx="12" fill="#6b55dd"/><path d="M27 28h16M27 35h11" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="70" y="31" fill="#f8fafc" font-size="18" font-weight="700">[HOTFIX] Search ordering · ENG-184</text><text x="70" y="52" fill="#b8dfd8" font-size="14">Fix search result ordering…</text>
        <circle cx="470" cy="34" r="13" fill="#f0a064"/><text x="466" y="39" fill="#251b13" font-size="14" font-weight="800">!</text>
      </g>
      <g transform="translate(25 214)">
        <rect width="498" height="70" rx="12" fill="#294a53"/>
        <rect x="14" y="14" width="42" height="42" rx="12" fill="#6b55dd"/><path d="M27 28h16M27 35h11" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="70" y="31" fill="#edfdf9" font-size="18" font-weight="700">[BACKLOG] Search ordering · ENG-219</text><text x="70" y="52" fill="#b8dfd8" font-size="14">Fix search result ordering…</text>
      </g>
      <g transform="translate(25 296)">
        <rect width="498" height="70" rx="12" fill="#294a53"/>
        <rect x="14" y="14" width="42" height="42" rx="12" fill="#1f9c78"/><path d="M26 31l9-7 9 7v13H26Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
        <text x="70" y="31" fill="#edfdf9" font-size="18" font-weight="700">[READY] Review flow · PR #482</text><text x="70" y="52" fill="#b8dfd8" font-size="14">Improve review flow for…</text>
      </g>
      <g transform="translate(25 378)">
        <rect width="498" height="70" rx="12" fill="#294a53"/>
        <rect x="14" y="14" width="42" height="42" rx="12" fill="#1f9c78"/><path d="M26 31l9-7 9 7v13H26Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
        <text x="70" y="31" fill="#edfdf9" font-size="18" font-weight="700">[CHANGES] Review flow · PR #496</text><text x="70" y="52" fill="#b8dfd8" font-size="14">Improve review flow for…</text>
      </g>
      <g transform="translate(25 470)"><path d="M12 0H486" stroke="#49737b"/><text x="0" y="31" fill="#afdad3" font-size="15">4 tabs · each one readable at a glance</text></g>

      <g transform="translate(610 124)">
        <text x="0" y="0" fill="#a8d0ca" font-size="16" font-weight="700" letter-spacing="1.6">ONE SIMPLE RULE PER SITE</text>
        <rect y="26" width="708" height="196" rx="18" fill="#173139" stroke="#3e6970"/>
        <text x="31" y="68" fill="#8be5d2" font-size="16" font-weight="700">IF URL MATCHES</text>
        <rect x="31" y="84" width="292" height="38" rx="8" fill="#0f2027"/><text x="47" y="109" fill="#d8efec" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tracker.example / issues</text>
        <path d="M354 103h55" stroke="#70d9c5" stroke-width="3" stroke-linecap="round"/><path d="M402 96l10 7-10 7" fill="none" stroke="#70d9c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="441" y="68" fill="#8be5d2" font-size="16" font-weight="700">NAME IT</text>
        <rect x="441" y="84" width="232" height="38" rx="8" fill="#0f2027"/><text x="457" y="109" fill="#d8efec" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[STATUS] · {ID}</text>
        <text x="31" y="165" fill="#b9d5d1" font-size="17">Put status, team, repository, or ticket ID before the original title.</text>
      </g>
      <g transform="translate(610 376)">
        <rect width="708" height="116" rx="18" fill="#153e3d" stroke="#49af9d"/>
        <rect x="0" width="8" height="116" rx="4" fill="url(#shine)"/>
        <text x="32" y="46" fill="#effffb" font-size="22" font-weight="720">The original title stays intact.</text>
        <text x="32" y="81" fill="#b9dcd5" font-size="18">The important difference becomes the first thing you see.</text>
      </g>
      <g transform="translate(610 535)">
        <circle cx="17" cy="17" r="17" fill="#50cfb7"/><path d="M10 17l5 5 10-11" fill="none" stroke="#0d2927" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="47" y="23" fill="#d5f1eb" font-size="18">Scan once. Jump to the right tab.</text>
      </g>
    </g>
    <text x="110" y="926" fill="#a5cec8" font-size="20">Rule-based names turn a crowded sidebar into a calm, searchable workspace.</text>
  </g>
</svg>
