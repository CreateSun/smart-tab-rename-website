<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Before: repeated browser tabs in a vertical tab sidebar are hard to tell apart</title>
  <desc id="desc">An original browser interface illustration showing issue tracker and pull request tabs with the same repeated title prefixes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121826"/><stop offset="1" stop-color="#202b44"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#253149"/><stop offset="1" stop-color="#192238"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#030712" flood-opacity=".46"/></filter>
    <filter id="soft" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="180" cy="84" r="190" fill="#4569d9" opacity=".18" filter="url(#soft)"/>
  <circle cx="1480" cy="890" r="240" fill="#a855f7" opacity=".14" filter="url(#soft)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="110" y="116" fill="#9fb4d3" font-size="24" font-weight="700" letter-spacing="3">VERTICAL TAB SIDEBAR · BEFORE</text>
    <text x="110" y="173" fill="#f8fafc" font-size="46" font-weight="760">Every tab begins the same way.</text>
    <text x="110" y="215" fill="#b9c7dc" font-size="24">When the sidebar truncates repeated titles, the actual context disappears.</text>

    <g transform="translate(110 275)" filter="url(#shadow)">
      <rect width="1380" height="590" rx="25" fill="#0d1320" stroke="#3c4a66" stroke-width="2"/>
      <path d="M0 25Q0 0 25 0H1355Q1380 0 1380 25V72H0Z" fill="#202b40"/>
      <circle cx="38" cy="36" r="8" fill="#ff6b67"/><circle cx="66" cy="36" r="8" fill="#f9bf45"/><circle cx="94" cy="36" r="8" fill="#61d28c"/>
      <rect x="156" y="19" width="515" height="36" rx="10" fill="#303e58"/>
      <circle cx="177" cy="37" r="8" fill="#8395b2"/><text x="196" y="43" fill="#b8c6dc" font-size="16">workspace / browser</text>
      <rect y="72" width="486" height="518" fill="url(#panel)"/>
      <path d="M486 72V590" stroke="#3c4a66" stroke-width="2"/>
      <text x="28" y="111" fill="#93a5c2" font-size="15" font-weight="700" letter-spacing="1.6">OPEN TABS</text>
      <g transform="translate(25 132)">
        <rect width="436" height="70" rx="12" fill="#34445f" stroke="#60799d"/>
        <rect x="14" y="14" width="42" height="42" rx="12" fill="#6b55dd"/><path d="M27 28h16M27 35h11" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="70" y="31" fill="#f8fafc" font-size="18" font-weight="650">Fix search result ordering…</text><text x="70" y="52" fill="#aebed5" font-size="14">tracker.example / ENG-184</text>
        <circle cx="410" cy="34" r="13" fill="#ef7e6d"/><text x="406" y="39" fill="#251416" font-size="14" font-weight="800">!</text>
      </g>
      <g transform="translate(25 214)">
        <rect width="436" height="70" rx="12" fill="#29364e"/>
        <rect x="14" y="14" width="42" height="42" rx="12" fill="#6b55dd"/><path d="M27 28h16M27 35h11" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="70" y="31" fill="#e6edf9" font-size="18" font-weight="650">Fix search result ordering…</text><text x="70" y="52" fill="#aebed5" font-size="14">tracker.example / ENG-219</text>
      </g>
      <g transform="translate(25 296)">
        <rect width="436" height="70" rx="12" fill="#29364e"/>
        <rect x="14" y="14" width="42" height="42" rx="12" fill="#1f9c78"/><path d="M26 31l9-7 9 7v13H26Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
        <text x="70" y="31" fill="#e6edf9" font-size="18" font-weight="650">Improve review flow for…</text><text x="70" y="52" fill="#aebed5" font-size="14">code.example / pull/482</text>
      </g>
      <g transform="translate(25 378)">
        <rect width="436" height="70" rx="12" fill="#29364e"/>
        <rect x="14" y="14" width="42" height="42" rx="12" fill="#1f9c78"/><path d="M26 31l9-7 9 7v13H26Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
        <text x="70" y="31" fill="#e6edf9" font-size="18" font-weight="650">Improve review flow for…</text><text x="70" y="52" fill="#aebed5" font-size="14">code.example / pull/496</text>
      </g>
      <g transform="translate(25 470)"><path d="M12 0H424" stroke="#44536e"/><text x="0" y="31" fill="#97a9c6" font-size="15">4 tabs · 2 indistinguishable pairs</text></g>

      <g transform="translate(548 135)">
        <rect width="748" height="362" rx="18" fill="#182136" stroke="#35435c"/>
        <text x="39" y="57" fill="#a5b6d4" font-size="16" font-weight="700" letter-spacing="1.6">WHAT YOU SEE IN THE SIDEBAR</text>
        <text x="39" y="112" fill="#f8fafc" font-size="30" font-weight="700">“Fix search result ordering…”</text>
        <text x="39" y="157" fill="#f8fafc" font-size="30" font-weight="700">“Improve review flow for…”</text>
        <rect x="39" y="191" width="670" height="1" fill="#3a4861"/>
        <text x="39" y="238" fill="#9fb0ca" font-size="19">Which issue is the hotfix? Which PR is ready to merge?</text>
        <text x="39" y="271" fill="#9fb0ca" font-size="19">The answer is hidden past the title cutoff.</text>
        <g transform="translate(39 309)"><rect width="205" height="32" rx="16" fill="#4b2c3a"/><text x="16" y="22" fill="#ffb4aa" font-size="15" font-weight="700">CONTEXT LOST</text></g>
      </g>
      <g transform="translate(548 530)">
        <circle cx="17" cy="17" r="17" fill="#f0a064"/><path d="M17 8v12M17 25v1" stroke="#2c1a11" stroke-width="3" stroke-linecap="round"/>
        <text x="47" y="23" fill="#d8e1f0" font-size="18">A tiny tab title is carrying too much information.</text>
      </g>
    </g>
    <text x="110" y="926" fill="#8fa3c3" font-size="20">A common day: several related tickets and pull requests open at once.</text>
  </g>
</svg>
